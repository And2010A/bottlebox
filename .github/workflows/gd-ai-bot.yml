name: Build AI Bot mod

on:
  workflow_dispatch:
  push:
    paths:
      - "gd-ai-bot/**"
      - ".github/workflows/gd-ai-bot.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-ai-bot
          combine: true
          target: ${{ matrix.config.target }}

  # Geode needs a recent Microsoft Visual C++ runtime. These are the
  # official redistributable DLLs from Visual Studio, for PCs where the
  # runtime cannot be updated: they work when placed next to GeometryDash.exe.
  runtime:
    name: VC++ runtime
    runs-on: windows-latest

    steps:
      - name: Collect the Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter "Microsoft.VC14*.CRT" | Select-Object -First 1
          Write-Host "Using $($crt.FullName)"
          New-Item -ItemType Directory vc-runtime | Out-Null
          Copy-Item "$($crt.FullName)\*.dll" vc-runtime
          Get-ChildItem vc-runtime | ForEach-Object { "{0}  {1}" -f $_.Name, $_.VersionInfo.FileVersion }
          $hit = Select-String -Path vc-runtime\*.dll -Pattern "__std_calloc_crt" -SimpleMatch -List
          if (-not $hit) { throw "No DLL exports __std_calloc_crt" }
          $hit | ForEach-Object { "__std_calloc_crt is in $($_.Filename)" }
          Compress-Archive -Path vc-runtime\* -DestinationPath vc-runtime-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: vc-runtime
          path: vc-runtime-x64.zip

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build', 'runtime']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: AI Bot mod
          path: ${{ steps.build.outputs.build-output }}

      - uses: actions/download-artifact@v7
        with:
          name: vc-runtime
          path: runtime

      # A fixed release gives a permanent direct download link:
      # https://github.com/And2010A/bottlebox/releases/download/gd-ai-bot-latest/and2010a.ai-bot.geode
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gd-ai-bot-latest
          target_commitish: ${{ github.sha }}
          name: AI Bot (Geode mod) — latest build
          body: |
            Самонавчальний бот для Geometry Dash 2.2081 (Geode 5.11.1).
            Поклади `and2010a.ai-bot.geode` у папку `geode/mods` гри. Інструкція: gd-ai-bot/README.md
          prerelease: true
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            runtime/vc-runtime-x64.zip
