name: Build AI Bot mod

on:
  workflow_dispatch:
  push:
    paths:
      - "gd-ai-bot/**"
      - ".github/workflows/gd-ai-bot.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-ai-bot
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: AI Bot mod
          path: ${{ steps.build.outputs.build-output }}

      # A fixed release gives a permanent direct download link:
      # https://github.com/And2010A/bottlebox/releases/download/gd-ai-bot-latest/and2010a.ai-bot.geode
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gd-ai-bot-latest
          target_commitish: ${{ github.sha }}
          name: AI Bot (Geode mod) — latest build
          body: |
            Самонавчальний бот для Geometry Dash 2.2081 (Geode 5.11.1).
            Поклади `and2010a.ai-bot.geode` у папку `geode/mods` гри. Інструкція: gd-ai-bot/README.md
          prerelease: true
          files: ${{ steps.build.outputs.build-output }}/*.geode
